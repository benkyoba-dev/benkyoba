<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="金沢大学角間キャンパスともりの里で、長時間勉強できる場所を探せるWebアプリ(試用版・非公式)">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ベンキョバ 角間・もりの里</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: a phone-width study notebook — graph-paper map on top, spot list below, bottom tab bar; sheets slide up for detail. */
:root {
  --bg: #f1f3ee; --surface: #ffffff; --ink: #1c2332; --muted: #5d6576; --line: #d8dcd3; --grid: #e3e7de;
  --accent: #2a47c4; --accent-soft: #e2e7fa; --mark: #f4d54a; --mark-ink: #3a2f00;
  --good: #2c8a57; --warn: #b97c0e; --bad: #c4423a; --good-soft: #e1f2e8; --warn-soft: #fbefd6; --bad-soft: #f9e2df;
  --road: #ffffff; --water: #d6e4f2; --park: #dcebd6; --shadow: 0 10px 30px rgba(28,35,50,.14);
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13161c; --surface: #1b1f27; --ink: #e7eaf0; --muted: #9aa2b2; --line: #2b313c; --grid: #1f242c;
  --accent: #8fa3ff; --accent-soft: #232a47; --mark: #c9a730; --mark-ink: #1a1500;
  --good: #5bbf88; --warn: #e0aa45; --bad: #ee7067; --good-soft: #17301f; --warn-soft: #33270f; --bad-soft: #3a1c1a;
  --road: #2a303a; --water: #1d2a3a; --park: #1c2b20; --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13161c; --surface: #1b1f27; --ink: #e7eaf0; --muted: #9aa2b2; --line: #2b313c; --grid: #1f242c;
  --accent: #8fa3ff; --accent-soft: #232a47; --mark: #c9a730; --mark-ink: #1a1500;
  --good: #5bbf88; --warn: #e0aa45; --bad: #ee7067; --good-soft: #17301f; --warn-soft: #33270f; --bad-soft: #3a1c1a;
  --road: #2a303a; --water: #1d2a3a; --park: #1c2b20; --shadow: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.logo { font-family: var(--f-display); font-size: 22px; letter-spacing: .02em; line-height: 1; }
.logo span { background: linear-gradient(transparent 58%, var(--mark) 58%); padding: 0 2px; }
.area { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; line-height: 1.35; }
.proto { display: inline-block; font-size: 10.5px; letter-spacing: .08em; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }

/* map */
.mapbox { position: relative; margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.mapbox svg { display: block; width: 100%; height: auto; }
.mapwrap { position: relative; }
.mapwrap.zoomed svg { touch-action: none; cursor: grab; }
.mapwrap.picking svg { cursor: crosshair; }
.mapctl { position: absolute; right: 8px; top: 8px; display: grid; gap: 4px; }
.mapctl button, .herebtn, .areabtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.mapctl button { width: 34px; height: 34px; font-size: 18px; font-weight: 700; line-height: 1; }
.mapctl button:disabled { opacity: .4; }
.herebtn { position: absolute; right: 8px; bottom: 8px; display: flex; align-items: center; gap: 5px; padding: 6px 10px; font-size: 12.5px; font-weight: 700; }
.herebtn svg { width: 16px; height: 16px; color: var(--accent); }
.areabtn { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); padding: 6px 14px; font-size: 13px; font-weight: 700; background: var(--ink); color: var(--surface); border-color: var(--ink); white-space: nowrap; }
.pickhint { position: absolute; left: 8px; right: 50px; bottom: 8px; background: var(--ink); color: var(--surface); font-size: 12.5px; border-radius: 8px; padding: 6px 10px; }
.baserow { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.baserow .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.baserow .seg button { border: 0; background: none; padding: 4px 10px; font-size: 13px; color: var(--ink); }
.baserow .seg button + button { border-left: 1px solid var(--line); }
.baserow .seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 700; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.chip.area { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); padding: 6px 10px; border-top: 1px solid var(--line); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
.pin { cursor: pointer; }
.pin text { font-family: var(--f-body); font-weight: 700; pointer-events: none; }

/* filters */
.filters { margin-top: 12px; display: grid; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.sortrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); }
.sortrow select { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 6px; font-size: 13px; }

/* list */
.list { display: grid; gap: 10px; margin-top: 8px; padding-bottom: 12px; }
.card { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; }
.card.ng { opacity: .72; }
.card h3 { margin: 0; font-size: 16px; font-weight: 700; min-width: 0; }
.card .meta { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.card .tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11.5px; border-radius: 4px; padding: 1px 6px; background: var(--grid); color: var(--ink); }
.tag.hl { background: var(--mark); color: var(--mark-ink); }
.tag.ng { background: var(--bad-soft); color: var(--bad); }
.crowd { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; align-self: start; }
.crowd.l0 { background: var(--good-soft); color: var(--good); }
.crowd.l1 { background: var(--warn-soft); color: var(--warn); }
.crowd.l2 { background: var(--bad-soft); color: var(--bad); }
.crowd.closed { background: var(--grid); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; font-size: 14px; }

/* tab bar */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
nav.tabs button { background: none; border: 0; padding: 9px 4px 10px; font-size: 12px; color: var(--muted); display: grid; justify-items: center; gap: 2px; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabdot { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); position: absolute; margin-left: 16px; }

/* sheet */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(10,14,22,.42); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; box-shadow: var(--shadow); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet .head { position: sticky; top: 0; background: var(--surface); z-index: 2; display: flex; align-items: flex-start; gap: 10px; padding-block: 14px 10px; border-bottom: 1px solid var(--line); }
.sheet h2 { margin: 0; font-size: 19px; line-height: 1.35; text-wrap: balance; }
.sheet .sub { font-size: 12.5px; color: var(--muted); }
.iconbtn { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn.on { background: var(--mark); color: var(--mark-ink); border-color: var(--mark); }
.sec { padding-block: 14px 4px; display: grid; gap: 8px; }
.sec h4 { margin: 0; font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.src { font-size: 10.5px; letter-spacing: .04em; border-radius: 3px; padding: 0 5px; font-weight: 500; }
.src.off { background: var(--accent-soft); color: var(--accent); }
.src.usr { background: var(--grid); color: var(--muted); }
.rules { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.rules.welcome, .rules.ok { background: var(--good-soft); }
.rules.busy_ng { background: var(--warn-soft); }
.rules.ng { background: var(--bad-soft); }
.rules b { display: block; font-size: 15px; }
dl.kv { margin: 0; display: grid; grid-template-columns: 7.5em 1fr; gap: 6px 12px; font-size: 14px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.stat .v { font-family: var(--f-mono); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.stat .k { font-size: 11.5px; color: var(--muted); }
.crowdpost { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.crowdpost button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 4px; font-size: 13.5px; font-weight: 700; }
.crowdpost button.l0 { color: var(--good); } .crowdpost button.l1 { color: var(--warn); } .crowdpost button.l2 { color: var(--bad); }
.hint { font-size: 12px; color: var(--muted); }
.review { border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; }
.review .who { font-size: 12px; color: var(--muted); }
.btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 700; font-size: 15px; background: var(--accent); color: var(--surface); width: 100%; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.small { width: auto; padding: 7px 12px; font-size: 13.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: grid; gap: 4px; font-size: 13px; }
.field select, .field input, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 15px; width: 100%; }
.stars { display: flex; gap: 4px; }
.stars button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 36px; height: 32px; font-family: var(--f-mono); font-weight: 600; }
.stars button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* timer */
/* 見出しは漢字がつぶれないよう本文と同じゴシック体の太字。極太の表示用書体はロゴだけに使う */
.page-title { font-family: var(--f-body); font-weight: 700; font-size: 21px; line-height: 1.4; letter-spacing: .04em; margin: 16px 0 4px; }
.tcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; margin-top: 10px; }
.clock { font-family: var(--f-mono); font-weight: 600; font-size: clamp(42px, 13vw, 60px); font-variant-numeric: tabular-nums; line-height: 1; text-align: center; letter-spacing: .02em; }
.clock-sub { text-align: center; font-size: 13px; color: var(--muted); }
.bar { height: 10px; border-radius: 999px; background: var(--grid); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; }
.bar.warn i { background: var(--warn); } .bar.over i { background: var(--bad); }
.nexts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.banner { border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 700; display: flex; gap: 10px; align-items: center; }
.banner.order { background: var(--mark); color: var(--mark-ink); }
.banner.limit { background: var(--bad-soft); color: var(--bad); }
.speed { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.speed input { width: 18px; height: 18px; accent-color: var(--accent); }
.week svg { width: 100%; height: auto; display: block; }
.week text { font-family: var(--f-body); }
.rec { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; font-size: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
.rec .d { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rec .m { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.note { font-size: 12px; color: var(--muted); margin: 14px 0 0; }

/* store mode */
.modebtn { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.modebtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
body.storemode nav.tabs { display: none; }
body.storemode .app { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.storehead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.storehead .page-title { margin: 0; }
.storehead select { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: 14px; max-width: 100%; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.kpis .stat .v { font-size: 22px; }
.sample { font-size: 10.5px; letter-spacing: .04em; border-radius: 3px; padding: 0 5px; background: var(--grid); color: var(--muted); font-weight: 500; }
.demand svg { width: 100%; height: auto; display: block; }
.demand text { font-family: var(--f-body); }
.keyrow { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.keyrow i { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.insight { border-left: 3px solid var(--accent); padding: 4px 0 4px 10px; font-size: 14px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.preview { border: 1px dashed var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.inbox { border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; display: grid; gap: 2px; }
.inbox .who { font-size: 12px; color: var(--muted); }

/* photos */
.gallery { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.ph { flex: none; width: 150px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; padding: 0; background: var(--surface); position: relative; text-align: left; display: block; }
.phimg, .bigph { display: block; aspect-ratio: 4 / 3; width: 100%; max-width: 100%; background: var(--grid); overflow: hidden; }
.phimg > svg, .phimg > img, .bigph > svg, .bigph > img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bigph { border-radius: 10px; }
.phbadge { position: absolute; left: 6px; top: 6px; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
.phbadge.store { background: var(--accent); color: var(--surface); }
.phbadge.student { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.ph .cap { display: block; font-size: 11.5px; padding: 4px 7px 6px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.phitem { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: grid; position: relative; min-width: 0; }
.phitem .cap { font-size: 12px; padding: 4px 8px 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phitem button { margin: 6px 8px 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 6px; font-size: 12.5px; }
.upprev img { max-height: 200px; max-width: 100%; border-radius: 8px; display: block; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; }
.check input { width: 18px; height: 18px; margin-top: 3px; flex: none; accent-color: var(--accent); }
input[type="file"] { font-size: 13.5px; max-width: 100%; }
.ask { font-size: 14px; font-weight: 700; }
.modebar { display: flex; align-items: center; gap: 6px; padding-block: 0 8px; font-size: 12px; color: var(--muted); }
.modebar button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 12px; font-size: 12.5px; font-weight: 700; color: var(--ink); }
.modebar button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.qsum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.qsum a { display: grid; gap: 0; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.qsum .v { font-family: var(--f-mono); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; }
.qsum .v.hot { color: var(--bad); }
.qsum .k { font-size: 11px; color: var(--muted); line-height: 1.3; }
@media (max-width: 380px) { .qsum { grid-template-columns: repeat(2, 1fr); } }
.kpi { display: grid; gap: 4px; }
.kpi .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
.kpi .top b { font-family: var(--f-mono); font-size: 17px; font-variant-numeric: tabular-nums; }
.kpi .bar { height: 7px; }
.qitem { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; font-size: 14px; }
.qitem .who { font-size: 12px; color: var(--muted); }
.qitem .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.qitem .acts button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 12px; font-size: 13px; font-weight: 700; }
.qitem .acts button.ok { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.qitem.withph { grid-template-columns: 120px 1fr; align-items: start; }
.qitem.withph .phimg { border-radius: 6px; }
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; font-size: 13px; }

const DEMAND = { 8: 3, 9: 4, 10: 6, 11: 5, 12: 4, 13: 7, 14: 10, 15: 12, 16: 12, 17: 11, 18: 8, 19: 9, 20: 8, 21: 5 };

  let best = null;
  for (let h = 8; h <= 19; h++) {
    if (![h, h + 1, h + 2].every(x => open(x) && !s.busyAt.includes(x))) continue;
    const sum = DEMAND[h] + DEMAND[h + 1] + DEMAND[h + 2];
    if (!best || sum > best.sum) best = { from: h, to: h + 3, sum };
  }
  return { svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="学生が勉強場所を探す時間帯とお店が混む時間帯">${g}</svg>`, best };
}

function readDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
async function toJpeg(file) {
  const url = await readDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const k = Math.min(1, 900 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.78);
}
async function addPhoto(file, caption, by, who, spot) {

    if (!save()) { store.photos.pop(); toast('この端末の保存容量がいっぱいです。写真を削除してから試してください'); return false; }

function saveStore() {
  const s = spotById(store.storeSpot);
  const v = id => document.getElementById(id).value;
  let from = v('stFrom') === '' ? null : +v('stFrom');
  let to = v('stTo') === '' ? null : +v('stTo');
  if (from !== null && (to === null || to <= from)) { toast('歓迎の時間帯は、終了を開始より後にしてください'); return; }
  if (from === null) to = null;
  const seats = Math.max(0, Math.floor(+v('stSeats') || 0)), pseats = Math.max(0, Math.floor(+v('stPowerSeats') || 0));
  if (pseats > seats) { toast('電源のある席は、勉強できる席の数以下にしてください'); return; }
  const ov = {
    study: v('stStudy'), studyFrom: from, studyTo: to,
    limit: v('stLimit') === '' ? null : +v('stLimit'), orderEvery: v('stOrder') === '' ? null : +v('stOrder'),
    power: v('stPower'), seatsStudy: seats, seatsPower: pseats, desk: v('stDesk'), seatNote: v('stSeatNote').trim(), rule: v('stRule').trim() || s.rule, coupon: v('stCoupon').trim(),
    paused: document.getElementById('stPaused').checked, ownerSet: true, checked: dateKey(new Date())
  };
  Object.assign(s, ov); store.overrides[s.id] = ov; save();
  toast(ov.paused ? '保存しました。掲載を停止しています' : '保存しました。利用者画面に反映されています');
  render();
}

// ---------- timer ----------
function tElapsedMin() {
  const t = store.timer; if (!t) return 0;
  const now = t.pausedAt || Date.now();
  return Math.max(0, (now - t.start - t.pausedTotal) / 60000 * (t.fast ? 60 : 1));
}
const fmtClock = m => { const s = Math.floor(m * 60); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`; };
const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)}時間${pad(Math.round(m % 60))}分` : `${Math.round(m)}分`;

function timerAlerts() {
  const t = store.timer; if (!t) return [];
  const s = spotById(t.spot); const m = tElapsedMin(); const out = [];
  if (s.orderEvery) {
    const n = Math.floor(m / s.orderEvery);
    if (n > (t.orders || 0)) { t.orders = n; save(); toast(`${s.orderEvery * n}分経過。お店のお願いに合わせて、追加の注文をどうぞ`); }
    if (n > 0 && m - n * s.orderEvery < 15) out.push(['order', `追加注文の目安です(${s.orderEvery}分ごとに1オーダー)`]);
  }
  if (s.limit) {
    if (m >= s.limit - 15 && !t.warned) { t.warned = true; save(); toast(`滞在の上限まであと15分です`); }
    if (m >= s.limit && !t.over) { t.over = true; save(); toast(`滞在の上限(${s.limit}分)になりました。そろそろ移動しましょう`); }
    if (m >= s.limit) out.push(['limit', `滞在の上限(${s.limit}分)を過ぎています。次の場所を探しましょう`]);
    else if (m >= s.limit - 15) out.push(['limit', `滞在の上限まであと${Math.ceil(s.limit - m)}分`]);
  }
  return out;
}

function renderTimer() {
  const t = store.timer;
  let body;
  if (!t) {
    const opts = SPOTS.filter(s => s.study !== 'ng' && s.study !== 'unknown').map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
    body = `<div class="tcard">
      <div class="clock" aria-hidden="true">00:00:00</div>
      <label class="field">勉強する場所<select id="tSpot">${opts}</select></label>
      <div class="hint">お店の滞在上限と追加注文のお願いに合わせて、目安の時間をお知らせします。</div>
      <label class="speed"><input type="checkbox" id="tFast"> デモ用に60倍速で進める(1秒=1分)</label>
      <button class="btn" id="tStart">チェックインして開始</button>
    </div>`;
  } else {
    const s = spotById(t.spot); const m = tElapsedMin();
    const alerts = timerAlerts();
    const pct = s.limit ? Math.min(100, m / s.limit * 100) : 0;

function renderWeek() {
  const days = []; const now = new Date();
  for (let i = 6; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i); days.push(d); }
  const wd = ['日', '月', '火', '水', '木', '金', '土'];
  const sums = days.map(d => store.records.filter(r => r.date === dateKey(d)).reduce((a, r) => a + r.min, 0));
  const total = sums.reduce((a, b) => a + b, 0);
  const max = Math.max(240, ...sums);
  const top = Math.ceil(max / 60) * 60;
  const W = 340, H = 150, L = 30, B = 128, T = 12, bw = 28, gapW = (W - L - 8) / 7;
  let g = '';
  for (let v = 0; v <= top; v += 60 * Math.max(1, Math.ceil(top / 60 / 4))) {
    const y = B - (v / top) * (B - T);
    g += `<line x1="${L}" x2="${W - 4}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v / 60}h</text>`;
  }
  days.forEach((d, i) => {
    const x = L + 4 + i * gapW + (gapW - bw) / 2;
    const h = (sums[i] / top) * (B - T);
    const today = i === 6;
    g += `<rect x="${x}" y="${B - h}" width="${bw}" height="${Math.max(h, 0)}" rx="4" fill="${today ? 'var(--accent)' : 'var(--line)'}"/>`;
    if (sums[i]) g += `<text x="${x + bw / 2}" y="${B - h - 4}" text-anchor="middle" font-size="10" fill="var(--ink)" font-family="var(--f-mono)">${(sums[i] / 60).toFixed(1)}</text>`;
    g += `<text x="${x + bw / 2}" y="${B + 16}" text-anchor="middle" font-size="11" fill="${today ? 'var(--ink)' : 'var(--muted)'}" font-weight="${today ? 700 : 400}">${today ? '今日' : wd[d.getDay()]}</text>`;
  });
  const recent = [...store.records].reverse().slice(0, 5);
  return `<div class="tcard week">
    <div class="sortrow"><b style="color:var(--ink)">この7日間</b><span>合計 <b style="color:var(--ink);font-family:var(--f-mono)">${fmtMin(total)}</b></span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="この7日間の勉強時間">${g}</svg>
    ${recent.map(r => `<div class="rec"><span class="d">${r.date.slice(5).replace('-', '/')}</span><span>${esc(spotById(r.spot).name)}${r.sample ? ' <span class="tag">サンプル</span>' : ''}</span><span class="m">${fmtMin(r.min)}</span></div>`).join('')}
  </div>`;
}

    store.timer = null; save(); render(); return;
  }
  if (t.closest('#loginBtn')) { requireLogin(() => render()); return; }
  if (t.closest('#resetBtn')) { document.getElementById('resetConfirm').hidden = false; t.closest('#resetBtn').hidden = true; return; }
  if (t.closest('#resetNo')) { render(); return; }
  if (t.closest('#resetYes')) { try { localStorage.removeItem(KEY); Object.keys(localStorage).filter(k => k.indexOf('sb-') === 0).forEach(k => localStorage.removeItem(k)); } catch (err) {} location.reload(); return; }
});
(document.querySelector('.modebar') || document.createElement('div')).addEventListener('click', e => {
  const b = e.target.closest('[data-mode]'); if (!b || b.dataset.mode === mode) return;
  mode = b.dataset.mode; closeSheet(); render(); window.scrollTo(0, 0);
});
view.addEventListener('click', e => {
  if (mode !== 'ops') return;
  const t = e.target, d = k => { const el = t.closest(`[data-${k}]`); return el ? el.getAttribute(`data-${k}`) : null; };
  const jump = d('jump');
  if (jump) { e.preventDefault(); const el = document.getElementById(jump); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  let id;
  if ((id = d('edit-ok'))) { store.editStatus[id] = 'done'; setChecked(d('spot-id')); toast('反映済みにしました。最終確認日を今日に更新しました'); }
  else if ((id = d('edit-ng'))) { store.editStatus[id] = 'rejected'; save(); toast('提案を却下しました'); }
  else if ((id = d('photo-ok'))) { store.photoStatus[id] = 'ok'; store.hiddenPhotos = store.hiddenPhotos.filter(x => x !== id); save(); toast('写真を再表示しました'); }
  else if ((id = d('photo-del'))) { store.photoStatus[id] = 'removed'; save(); toast('写真を削除しました'); }
  else if ((id = d('new-ok'))) { store.newStatus[id] = 'ok'; save(); toast('現地確認の予定に入れました'); }
  else if ((id = d('new-ng'))) { store.newStatus[id] = 'ng'; save(); toast('提案を見送りました'); }
  else if ((id = d('fresh'))) { setChecked(id); toast(`${spotById(id).name} を確認済みにしました`); }
  else return;
  render();
});
function showPreview(input, boxId) {
  const f = input.files[0], box = document.getElementById(boxId); if (!box) return;
  if (!f) { box.innerHTML = ''; return; }
  readDataURL(f).then(u => { box.innerHTML = `<img src="${u}" alt="選んだ写真のプレビュー">`; }).catch(() => { box.innerHTML = ''; });
}
sheetRoot.addEventListener('change', e => {
  if (e.target.id === 'phFile') showPreview(e.target, 'phPrev');
  if (e.target.id === 'waitIn' && e.target.checked) { const r = document.getElementById('pctIn'); if (r) { r.value = 100; r.dispatchEvent(new Event('input', { bubbles: true })); } }
});
sheetRoot.addEventListener('input', e => {
  if (e.target.id !== 'pctIn') return;
  const o = document.getElementById('pctOut'); if (o) o.textContent = `${e.target.value}% ・ ${pctLabel(+e.target.value)}`;
});
view.addEventListener('submit', e => {
  if (e.target.id === 'stForm') { e.preventDefault(); saveStore(); return; }
  if (e.target.id === 'stPhotoForm') {
    e.preventDefault();
    const s = spotById(store.storeSpot);
    const file = document.getElementById('stPhotoFile').files[0];
    if (!file) { toast('写真を選んでください'); return; }
    if (!document.getElementById('stPhotoOk').checked) { toast('写り込みの確認にチェックしてください'); return; }
    const btn = document.getElementById('stPhotoSubmit'); btn.disabled = true; btn.textContent = '処理中…';
    addPhoto(file, document.getElementById('stPhotoCap').value.trim(), 'store', s.name, s.id).then(ok => {
      if (ok) { render(); toast('お店の写真を追加しました。利用者画面にも表示されます'); } else { btn.disabled = false; btn.textContent = '写真を追加'; }
    });
  }
});
view.addEventListener('click', e => {
  const del = e.target.closest('[data-del]'), rep = e.target.closest('[data-rep]');
  if (del) { const id = del.dataset.del; if (id.startsWith('up-')) store.photos = store.photos.filter(p => p.id !== id); else store.hiddenPhotos.push(id); save(); toast('写真を削除しました'); render(); }
  if (rep) { reportPhoto(rep.dataset.rep, store.storeSpot, 'お店'); toast('報告しました。運営が確認するまで非表示にします'); render(); }
});
view.addEventListener('click', e => {
  if (e.target.closest('#stPreview')) { const id = store.storeSpot; mode = 'user'; tab = 'search'; selected = id; render(); window.scrollTo(0, 0); openSheet('detail', id); }
  if (e.target.closest('#stReset')) {
    const id = store.storeSpot; delete store.overrides[id]; save();
    Object.assign(spotById(id), JSON.parse(JSON.stringify(ORIGINAL.find(x => x.id === id))));
    toast('初期の設定に戻しました'); render();
  }
});
view.addEventListener('input', e => { if (e.target.id === 'q') { query = e.target.value; updateResults(); } });
view.addEventListener('submit', e => { if (e.target.id === 'searchForm') { e.preventDefault(); const q = document.getElementById('q'); if (q) q.blur(); } });
view.addEventListener('click', e => {
  const sq = e.target.closest('[data-q]'), clr = e.target.closest('#qClear');
  if (!sq && !clr) return;
  query = sq ? sq.dataset.q : '';
  const q = document.getElementById('q'); if (q) { q.value = query; if (clr) q.focus(); }
  updateResults();
});
view.addEventListener('change', e => { if (e.target.id === 'stPhotoFile') { showPreview(e.target, 'stPhotoPrev'); return; } if (e.target.id === 'stPick') { store.storeSpot = e.target.value; save(); render(); return; } if (e.target.id === 'sortSel') { filters.sort = e.target.value; store.filters = filters; save(); render(); } });
view.addEventListener('keydown', e => { const p = e.target.closest && e.target.closest('g.pin'); if (p && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); p.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });

sheetRoot.addEventListener('click', e => {
  const t = e.target;
  const closeEl = t.closest('[data-close]');
  if (closeEl && (closeEl.tagName === 'BUTTON' || t === closeEl)) { if (sheet && sheet.kind === 'login' && sheet.back) { sheet = sheet.back; renderSheet(); } else closeSheet(); return; }
  if (t.closest('[data-back]')) { openSheet('detail', sheet.spot); return; }
  const s = sheet && spotById(sheet.spot);
  if (t.closest('#favBtn')) {
    store.favs = store.favs.includes(s.id) ? store.favs.filter(x => x !== s.id) : [...store.favs, s.id];
    save(); toast(store.favs.includes(s.id) ? 'お気に入りに保存しました' : 'お気に入りから外しました'); renderSheet(); render(); return;
  }
  if (t.closest('#postCrowd')) {
    const pct = +document.getElementById('pctIn').value, waiting = document.getElementById('waitIn').checked;
    if (crowdWait(s.id)) { toast(`この場所への混雑投稿は30分に1回までです。${hhmm(Date.now() + crowdWait(s.id))} ごろからまた投稿できます`); return; }
    requireLogin(() => { if (crowdWait(s.id)) { openSheet('detail', s.id); return; } postCrowdShared(s, pct, waiting); });
    return;
  }
  if (t.closest('#startHere')) {
    if (store.timer) { toast('すでにタイマーが動いています。終了してから始めてください'); return; }
    store.timer = { spot: s.id, start: Date.now(), pausedTotal: 0, pausedAt: null, fast: false, orders: 0 };
    save(); closeSheet(); tab = 'timer'; render(); toast(`${s.name} にチェックインしました`); return;
  }
  if (t.closest('#revBtn')) { requireLogin(() => openSheet('review', s.id)); return; }
  if (t.closest('#editBtn')) { requireLogin(() => openSheet('edit', s.id)); return; }
  const ph = t.closest('[data-photo]');
  if (ph) { openSheet('photo', s.id, { photo: ph.dataset.photo }); return; }
  if (t.closest('#photoBtn')) { requireLogin(() => openSheet('photoForm', s.id)); return; }
  const rep = t.closest('#phReport');
  if (rep) { reportPhoto(rep.dataset.id, s.id, '利用者'); openSheet('detail', s.id); render(); toast('報告しました。運営が確認するまで非表示にします'); return; }
  const star = t.closest('.stars button');
  if (star) { star.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === star)); return; }
});
sheetRoot.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'loginForm') {
    const name = document.getElementById('nick').value.trim(); if (!name) return;
    const role = document.getElementById('grade').value;
    const done = () => { const after = sheet.after; sheet = sheet.back; renderSheet(); toast(`${name}さん、ようこそ`); if (after) after(); render(); };
    if (!sb) { store.user = { name, grade: role }; save(); done(); return; }
    const btn = f.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = '登録しています…';
    signUpShared(name, role).then(ok => { if (ok) done(); else { btn.disabled = false; btn.textContent = 'はじめる'; } });
    return;
  }
  const s = spotById(sheet.spot);
  if (f.id === 'photoForm') {
    const file = document.getElementById('phFile').files[0];
    if (!file) { toast('写真を選んでください'); return; }
    if (!document.getElementById('phOk').checked) { toast('写り込みの確認にチェックしてください'); return; }
    const btn = document.getElementById('phSubmit'); btn.disabled = true; btn.textContent = '処理中…';
    addPhoto(file, document.getElementById('phCap').value.trim(), 'student', `${store.user.name}(${store.user.grade})`, s.id).then(ok => {
      if (ok) { openSheet('detail', s.id); render(); toast('写真を投稿しました'); } else { btn.disabled = false; btn.textContent = '投稿する'; }
    });
    return;
  }
  if (f.id === 'revForm') {
    const pick = k => +f.querySelector(`[data-stars="${k}"] [aria-pressed="true"]`).dataset.v;
    const text = document.getElementById('revText').value.trim() || '(コメントなし)';
    const rec = { spot: s.id, at: Date.now(), who: `${store.user.name}(${store.user.grade})`, stay: +document.getElementById('revStay').value, quiet: pick('quiet'), power: pick('power'), text };
    if (!sb) { store.reviews.push(rec); save(); openSheet('detail', s.id); render(); toast('レビューを投稿しました'); return; }
    const btn = f.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = '送信しています…';
    sb.from('reviews').insert({ spot_id: s.id, stay_min: rec.stay, quiet: rec.quiet, power: rec.power, body: document.getElementById('revText').value.trim() })
      .then(({ error }) => {
        if (error) { btn.disabled = false; btn.textContent = '投稿する'; toast(/上限/.test(error.message || '') ? error.message : 'レビューを投稿できませんでした。もう一度お試しください'); return; }
        store.reviews.push(rec); save(); refreshCount(); openSheet('detail', s.id); render(); toast('レビューを投稿しました。みんなの画面に表示されます');
      }, () => { btn.disabled = false; btn.textContent = '投稿する'; toast('通信できませんでした。もう一度お試しください'); });
    return;
  }
  if (f.id === 'editForm') {
    const rec = { spot: s.id, what: document.getElementById('editWhat').value, text: document.getElementById('editText').value.trim(), at: Date.now() };
    if (!rec.text) { toast('正しい内容を書いてください'); return; }
    if (!sb) { store.edits.push(rec); save(); openSheet('detail', s.id); render(); toast('運営に送りました。確認後に反映されます'); return; }
    const btn = f.querySelector('button[type="submit"]'); btn.disabled = true; btn.textContent = '送信しています…';
    sb.from('edit_requests').insert({ spot_id: s.id, field: rec.what, body: rec.text, source: document.getElementById('editSrc').value })
      .then(({ error }) => {
        if (error) { btn.disabled = false; btn.textContent = '運営に送る'; toast(/上限/.test(error.message || '') ? error.message : '送信できませんでした。もう一度お試しください'); return; }
        store.edits.push(rec); save(); refreshCount(); openSheet('detail', s.id); render(); toast('運営に届きました。確認後に反映します');
      }, () => { btn.disabled = false; btn.textContent = '運営に送る'; toast('通信できませんでした。もう一度お試しください'); });
    return;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });

// tick
setInterval(() => {
  if (!store.timer) return;
  if (mode !== 'user') { timerAlerts(); return; }
  if (tab === 'timer') {
    const c = document.getElementById('clock');
    const m = tElapsedMin();
    // full re-render each second keeps banners/progress in sync; keep cheap
    if (c) render();
  } else { timerAlerts(); document.getElementById('timerLabel').textContent = fmtClock(tElapsedMin()).slice(0, 5) + ' 勉強中'; }
}, 1000);

render();
initShared();
})();
</script>

</body>
</html>
